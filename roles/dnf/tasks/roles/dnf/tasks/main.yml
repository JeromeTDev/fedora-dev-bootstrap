---
- name: Ensure DNF main section exists
  become: true
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    regexp: '^\[main\]$'
    line: "[main]"
    state: present

- name: Configure DNF settings
  become: true
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    insertafter: '^\[main\]$'
    state: present
  loop: "{{ dnf_settings }}"
