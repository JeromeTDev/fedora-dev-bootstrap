---
# Zielhost-Bestimmung:
#   * Inventory mit Gruppe "fedora" vorhanden -> diese Hosts sind das Ziel
#   * kein Inventory bzw. keine Gruppe "fedora" -> dieser lokale Host ist das Ziel
# Damit reicht "git clone && ansible-playbook playbook.yml" ohne jedes Inventory.
- name: Zielhost bestimmen
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Hosts aus dem Inventory uebernehmen
      ansible.builtin.debug:
        msg: "Ziel aus Inventory: {{ groups['fedora'] | join(', ') }}"
      when: "'fedora' in groups"

    - name: Lokalen Host als Ziel setzen (kein Inventory-Ziel vorhanden)
      ansible.builtin.add_host:
        name: localhost
        groups: fedora
        ansible_connection: local
        ansible_python_interpreter: /usr/bin/python3
      when: "'fedora' not in groups"

    - name: Hinweis zur Inventory-Nutzung ausgeben
      ansible.builtin.debug:
        msg: >-
          Kein Inventory mit Gruppe 'fedora' gefunden - Ziel ist dieser Host.
          Fuer andere Maschinen: cp inventory.ini.example inventory.ini
      when: "'fedora' not in groups"

- name: Configure Fedora development workstation
  hosts: fedora

  pre_tasks:
    - name: Prepare Fedora for Ansible
      ansible.builtin.import_role:
        name: bootstrap
      tags: always
    - name: Paket-Fakten sammeln (fuer bedingte Rollen)
      ansible.builtin.package_facts:
        manager: auto
    - name: Display-Manager-Auswahl pruefen
      ansible.builtin.assert:
        that:
          - display_manager in ['greetd', 'none']
        fail_msg: >-
          display_manager muss 'greetd' oder 'none' sein
          (aktuell: {{ display_manager }}).

  roles:
    - base
    - packages
    - desktop
    - niri
    - dnf
    - copr
    # greetd installieren oder einen vorhandenen Greeter behalten.
    # 'none' ist fuer Systeme gedacht, die z. B. GDM weiter nutzen wollen.
    - role: greetd
      when: display_manager == 'greetd'
    - fonts
    - flatpak
    - shell
    - dotfiles
    - mise
