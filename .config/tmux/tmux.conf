# ==========================================
# GENERAL SETTINGS
# ==========================================
set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on
set -g set-clipboard on
set -s escape-time 0
set -g focus-events on
set -g xterm-keys on

set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_command}'

# ==========================================
# KEYBINDINGS
# ==========================================

# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# System
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"
bind s choose-session
bind Q confirm-before -p "Kill Session #S? (y/n)" kill-session

# Windows
bind c new-window -c "#{pane_current_path}"
bind -n S-Left previous-window
bind -n S-Right next-window
bind Tab last-window

# Panes (Splits & Zoom)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind x kill-pane
bind m resize-pane -Z

# NAVIGATION (Der Kern deiner Frage)
# Ändere das Resizing auf Pfeiltasten, um Shift-Buchstaben-Konflikte zu vermeiden
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5

# Pane-Springen auf den kleinen Buchstaben (Prefix + h,j,k,l)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Pane Navigation direkt über Alt (Meta)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Window Navigation über Alt
bind -n M-n next-window
bind -n M-p previous-window

# ==========================================
# COPY MODE & DESIGN
# ==========================================
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Ersetze deinen bisherigen Design-Block mit diesem:
set -g status-style "bg=default,fg=colour244" # Statusbar Hintergrund transparent
set -g status-justify centre
set -g status-left ""
set -g status-right ""

# Aktives Fenster: Nur der Text ist gelb/gold, kein Hintergrundbalken
set -g window-status-current-style "fg=colour220,bold,bg=default" 
set -g window-status-current-format " #I:#W "

# Inaktive Fenster
set -g window-status-style "fg=colour244,bg=default"
set -g window-status-format " #I:#W "

# ==========================================
# PLUGINS (Plugin-Navigator entfernt)
# ==========================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
run '~/.tmux/plugins/tpm/tpm'
