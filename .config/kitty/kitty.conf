# =============================
# SHELL
# =============================
shell /usr/bin/fish

# =============================
# SCHRIFT
# =============================
font_family       JetBrainsMono Nerd Font
bold_font         auto
italic_font       auto
bold_italic_font  auto
font_size         13
enable_ligatures  yes

# =============================
# CURSOR
# =============================
cursor_shape_unfocused  beam
cursor_blink_interval   0.5 
# cursor_color          #cccccc  # optional

# =============================
# FENSTER & PADDING
# =============================
window_padding_width    5
window_margin_width     3
window_border_width     1pt
active_border_color     #44ffff
hide_window_decorations yes
close_on_child_death    yes

# =============================
# TAB-BAR
# =============================
tab_bar_style        powerline
tab_powerline_style  slanted

# =============================
# AUDIO & MAUS
# =============================
enable_audio_bell  no
mouse_hide_wait    500

# =============================
# HINTERGRUND & TRANSPARENZ
# =============================
background_opacity    0.97
# background_blur       0.3
background_tint       0.95
background_tint_gaps -3.0

# =============================
# THEMES
# =============================
include theme.conf
# BEGIN_KITTY_THEME
include current-theme.conf
# END_KITTY_THEME

# ===============================
# Kitty Vim-Style Fenster Navigation
# ===============================
map ctrl+left neighboring_window left
map shift+left move_window right
map ctrl+down neighboring_window down
map shift+down move_window up


# Größe in Zeichen
initial_window_width  80
initial_window_height 24

# Vollbild deaktivieren
start_fullscreen no

# Position in Pixel (mittig auf 1920x1080)
window_position 560 420

# ==========
# Remote Control
# ==========
allow_remote_control yes
listen_on unix:/tmp/kitty

