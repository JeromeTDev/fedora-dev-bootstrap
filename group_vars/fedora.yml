---
# Sway/SwayFX-Rolle aktivieren (siehe roles/sway/defaults/main.yml).
# true  -> swayfx wird installiert bzw. ersetzt ein vorhandenes "sway"
# false -> Rolle wird komplett uebersprungen
install_swayfx: true
install_niri: true

dev_packages:
  - git
  - gh
  - make
  - gcc
  - fish
  # - kitty
  - neovim
  - wl-clipboard
  - fzf
  - tree
  - ripgrep
  - btop
  - zoxide
  - fd-find
  - ncdu
  - stow
  - jq
  - zathura
  - zathura-pdf-mupdf
  - poppler-utils
  - ImageMagick
  - mediainfo
  - perl-Image-ExifTool
  - xournalpp
  - texlive-scheme-medium
  - luarocks
  - keepassxc
  - fastfetch
  - tmux
  - gammastep
  - dolphin

copr_repositories:
  - atim/lazygit
  - atim/starship
  - lihaohong/yazi
  - scottames/ghostty

copr_packages:
  - lazygit
  - starship
  - yazi
  - ghostty

flatpak_apps:
  - com.teamspeak.TeamSpeak
  - com.discordapp.Discord
  - org.cryptomator.Cryptomator
  - md.obsidian.Obsidian
  - org.onlyoffice.desktopeditors
  - org.telegram.desktop
  - org.signal.Signal

dnf_settings:
  - key: fastestmirror
    value: "True"

  - key: max_parallel_downloads
    value: "15"

  - key: defaultyes
    value: "True"

  - key: install_weak_deps
    value: "False"

  - key: clean_requirements_on_remove
    value: "True"

  - key: plugins
    value: "1"

nerd_font_name: JetBrainsMono
nerd_font_url: "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/{{ nerd_font_name }}.zip"
nerd_font_archive: "/tmp/{{ nerd_font_name }}.zip"
nerd_font_dir: "{{ ansible_facts['env']['HOME'] }}/.local/share/fonts"
# Marker fuer die Idempotenz der fonts-Rolle: existiert diese Datei, gelten die
# Fonts als installiert und werden nicht erneut heruntergeladen/entpackt.
nerd_font_marker: "{{ nerd_font_dir }}/{{ nerd_font_name }}NerdFont-Regular.ttf"

mise_tools:
  - uv@latest
  - python@latest
  - opencode
