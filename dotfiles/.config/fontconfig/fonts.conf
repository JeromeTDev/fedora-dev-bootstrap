<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <!-- fontconfig 2.17 kann die WOFF/WOFF2-Varianten der TeX-Mathematikschrift
       "logix" (Paket texlive-logix) nicht parsen. Die daraus entstehenden
       Pattern haben weder family noch charset und matchen dadurch JEDE
       Anfrage. Dadurch bricht jede Anwendung, die Fonts per fontconfig
       matcht (z.B. Ghostty -> error.FontconfigNoMatch, keine Fonts sichtbar).

       Die OTF-Varianten sind intakt und bleiben aktiv. -->
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/logix/*.woff</glob>
      <glob>/usr/share/fonts/logix/*.woff2</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
