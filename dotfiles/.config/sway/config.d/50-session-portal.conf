# gnome-keyring fuer den Secret Service (Passwoerter/Cookies von Brave, Chromium, ...)
#
# Den Env-Import (XDG_CURRENT_DESKTOP usw.) und das Starten von
# sway-session.target uebernimmt bereits /etc/sway/config.d/10-systemd-session.conf
# aus dem Paket sway-systemd -> /usr/libexec/sway-systemd/session.sh
#
# Refs:
#   https://systemd.io/DESKTOP_ENVIRONMENTS/
#   https://emersion.github.io/xdg-desktop-portal-wlr/

exec --no-startup-id gnome-keyring-daemon --start --components=secrets
