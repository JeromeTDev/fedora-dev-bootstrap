# XDG Desktop Portal configuration for Niri
#
# GNOME: Screenshots, Screencasting, Desktop integration
# GTK: File chooser and fallback
# GNOME Keyring: Secret storage for Brave/Chromium

[preferred]
default=gnome;gtk;

# File picker (without Nautilus)
org.freedesktop.impl.portal.FileChooser=gtk;

# Screen sharing / screenshots
org.freedesktop.impl.portal.ScreenCast=gnome;
org.freedesktop.impl.portal.Screenshot=gnome;

# Authentication and notifications
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;

# Important: encrypted secret storage
org.freedesktop.impl.portal.Secret=gnome-keyring;
