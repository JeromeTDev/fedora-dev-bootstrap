# Backend-Auswahl fuer xdg-desktop-portal unter Sway.
# Siehe https://emersion.github.io/xdg-desktop-portal-wlr/
#
# Wichtig: org.freedesktop.impl.portal.Secret implementieren nur gnome-keyring
# und kwallet. Ohne diese Zeile hat Secret keinen Provider, Chromium/Brave
# fallen dann auf "basic" (Klartext, v10) zurueck und die gespeicherten
# Passwoerter sind unbrauchbar.
[preferred]
default=wlr;gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr

[interface-specific]
org.freedesktop.impl.portal.Secret=gnome-keyring
